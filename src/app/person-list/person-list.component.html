<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
  <h2>Person List</h2>
  <button (click)="goToAddPerson()">Add Person</button>
</div>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let person"> {{ person.id }} </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let person"> {{ person.name }} </td>
  </ng-container>

  <ng-container matColumnDef="age">
    <th mat-header-cell *matHeaderCellDef> Age </th>
    <td mat-cell *matCellDef="let person"> {{ person.age }} </td>
  </ng-container>

  <ng-container matColumnDef="address">
    <th mat-header-cell *matHeaderCellDef> Address </th>
    <td mat-cell *matCellDef="let person"> {{ person.address }} </td>
  </ng-container>

  <ng-container matColumnDef="phone_no">
    <th mat-header-cell *matHeaderCellDef> Phone No </th>
    <td mat-cell *matCellDef="let person"> {{ person.phone_no }} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator
  [length]="totalRecords"
  [pageSize]="5"
  [pageSizeOptions]="[5, 10, 15, 20, 25]"
  showFirstLastButtons>
</mat-paginator>
