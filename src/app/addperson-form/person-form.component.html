<div class="form-container">
  <form [formGroup]="personForm" (ngSubmit)="onSubmit()">
    <h2>Personal Details</h2>

    <label>
      Name:
      <input type="text" formControlName="name" />
    </label>
    <div *ngIf="isValid('name')" class="error">
      Name is required
    </div>

    <label>
      Age:
      <input type="number" formControlName="age" />
    </label>
    <div *ngIf="isValid('age')" class="error">
      Age is required
    </div>

    <label>
      Address:
      <input type="text" formControlName="address" />
    </label>
    <div *ngIf="isValid('address')" class="error">
      Address is required
    </div>

    <label>
      Phone No:
      <input type="number" formControlName="phone_no" />
    </label>
    <div *ngIf="isValid('phone_no')" class="error">
      Phone No is required
    </div>

    <div class="button-group">
      <button type="submit" class="submit-btn" [disabled]="isViewMode">Submit</button>
      <button type="button" class="cancel-btn" (click)="onCancel()">Cancel</button>
    </div>
  </form>

  <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</div>
